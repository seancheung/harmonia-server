services:
  server:
    build: .
    # Linux: multicast discovery and receiver-initiated timing traffic need LAN access.
    network_mode: host
    environment:
      HARMONIA_LISTEN: ${HARMONIA_LISTEN:-:8090}
      HARMONIA_ORIGIN: ${HARMONIA_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
      HARMONIA_TOKEN: ${HARMONIA_TOKEN:-}
    volumes:
      - data:/data
      - ${MUSIC_PATH:-./music}:/music:ro
    restart: unless-stopped
volumes:
  data:
